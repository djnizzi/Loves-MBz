<div class="innerDlg" data-id="tabLovesMBzContent">
    <style>
        .mbzExtIntro,
        .mbzExtEmpty {
            opacity: 0.75;
            white-space: normal;
        }
        .mbzExtTable {
            width: 100%;
            border-collapse: collapse;
        }
        .mbzExtTable th {
            text-align: left;
            font-weight: normal;
            opacity: 0.7;
            padding: 2px 6px;
        }
        .mbzExtTable td {
            padding: 4px 6px;
            vertical-align: top;
            border-top: 1px solid rgba(128, 128, 128, 0.25);
        }
        .mbzExtTitle {
            font-family: monospace;
            white-space: nowrap;
        }
        .mbzExtLabel {
            opacity: 0.6;
            font-size: 0.9em;
        }
        .mbzExtValue {
            width: 100%;
            min-width: 16em;
            box-sizing: border-box;
            padding: 2px 5px;
            font-family: monospace;
        }
        .mbzExtValue.mbzExtInvalid {
            outline: 1px solid #d9534f;
        }
        .mbzExtAdd {
            align-items: center;
            gap: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(128, 128, 128, 0.25);
        }
        .mbzExtSuggest {
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .mbzExtChip {
            cursor: pointer;
            padding: 0 10px;
            line-height: 22px;
        }
        /* A bare <select> keeps the browser's white popup background while it
           inherits the skin's light text, so it has to draw on the panel
           colour itself instead of the default control colour. */
        .mbzExtAddTag {
            min-width: 14em;
            max-width: 26em;
            padding: 2px 4px;
            color: inherit;
            background-color: transparent;
            border: 1px solid rgba(128, 128, 128, 0.5);
            border-radius: 4px;
        }
        .mbzExtAddTag option {
            color: inherit;
            background-color: inherit;
        }
        .mbzExtAddValue {
            min-width: 12em;
            padding: 2px 5px;
            font-family: monospace;
        }
        .mbzExtAddButton {
            white-space: nowrap;
        }
        .mbzExtTable tr.mbzExtNew td {
            border-top: 1px dashed rgba(128, 128, 128, 0.55);
        }
        .mbzExtLinks {
            white-space: nowrap;
        }
        .mbzExtLinks a {
            margin-right: 10px;
        }
        .mbzExtWarning {
            color: #d9534f;
            white-space: normal;
        }
    </style>

    <div class="flex column stretchWidth stretchHeight" style="gap: 6px;">
        <label data-id="mbzExtIntro" class="mbzExtIntro"></label>
        <label data-id="mbzExtSummary"></label>

        <div class="scrollable fill">
            <table class="mbzExtTable" data-id="mbzExtTable">
                <thead>
                    <tr>
                        <th data-localize>Tag</th>
                        <th data-localize>Value</th>
                        <th data-localize>Open</th>
                    </tr>
                </thead>
                <tbody data-id="mbzExtRows"></tbody>
            </table>
        </div>

        <label data-id="mbzExtEmpty" class="mbzExtEmpty" style="display: none;"></label>

        <div class="flex row mbzExtSuggest" data-id="mbzExtSuggestBar" style="display: none;"></div>

        <div class="flex row mbzExtAdd" data-id="mbzExtAddBar">
            <label class="mbzExtLabel" data-localize>Add tag</label>
            <select data-id="mbzExtAddTag" class="mbzExtAddTag"></select>
            <input data-id="mbzExtAddValue" class="mbzExtAddValue fill" spellcheck="false" autocomplete="off" />
            <div class="button mbzExtAddButton" data-id="mbzExtAddButton" data-localize>Add</div>
        </div>

        <label data-id="mbzExtStatus"></label>
    </div>
</div>
