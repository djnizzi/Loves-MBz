<html class="dialog">

<head>
    <title>MusicBrainz preview</title>
    <script src="file:///mminit.js"></script>
    <script src="dlgMBzPreview.js"></script>
    <style type="text/css">
        .mbzMetaTable { border-collapse: collapse; font-size: 0.95em; }
        .mbzMetaTable th {
            text-align: left;
            padding: 2px 12px 2px 0;
            font-weight: normal;
            opacity: 0.7;
            white-space: nowrap;
            vertical-align: top;
        }
        .mbzMetaTable td { padding: 2px 0; user-select: text; }
        .mbzScroll { overflow: auto; border: 1px solid rgba(128, 128, 128, 0.35); border-radius: 4px; }
        .mbzTable { width: 100%; border-collapse: collapse; font-size: 0.95em; }
        .mbzTable th {
            position: sticky;
            top: 0;
            text-align: left;
            padding: 4px 8px;
            font-weight: bold;
            white-space: nowrap;
            background: var(--backgroundColor, rgba(128, 128, 128, 0.15));
            border-bottom: 1px solid rgba(128, 128, 128, 0.4);
        }
        .mbzTable td {
            padding: 3px 8px;
            vertical-align: top;
            border-top: 1px solid rgba(128, 128, 128, 0.2);
        }
        .mbzTable td.mbzGuid { font-family: monospace; white-space: nowrap; user-select: text; }
        .mbzTable td.mbzNowrap { white-space: nowrap; }
        .mbzNote { opacity: 0.7; }
        .mbzHidden { display: none; }
        .mbzButton { padding: 0 14px; line-height: 24px; }
    </style>
</head>

<body data-posSaveName="dlgMBzPreview" data-defaultSize="1020,700">
    <div class="flex column fill padding" style="gap: 10px;">

        <label data-id="summary" class="padding" data-localize>Reading the release from MusicBrainz...</label>

        <table data-id="meta" class="mbzMetaTable mbzHidden">
            <tbody data-id="metaRows"></tbody>
        </table>

        <div data-id="tracks" class="fill mbzScroll mbzHidden" style="min-height: 160px;">
            <table class="mbzTable">
                <thead>
                    <tr>
                        <th data-localize>Disc</th>
                        <th data-localize>Track</th>
                        <th data-localize>Title</th>
                        <th data-localize>Length</th>
                        <th data-localize>ISRC</th>
                        <th data-localize>Recording ID</th>
                    </tr>
                </thead>
                <tbody data-id="trackRows"></tbody>
            </table>
        </div>

        <label data-id="note" class="mbzNote" data-localize>Preview only. Nothing is written to tags or the library.</label>

        <div data-control-class="Buttons">
            <div data-id="btnClose" data-default="1" data-esc></div>
        </div>
    </div>
</body>

</html>
