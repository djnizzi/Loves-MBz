<html class="dialog">

<head>
    <title>MusicBrainz preview</title>
    <script src="file:///mminit.js"></script>
    <script src="dlgMBzPreview.js"></script>
    <style type="text/css">
        html.dialog, html.dialog body { height: 100%; }
        html.dialog body {
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow: hidden;
        }
        .mbzPreviewRoot {
            box-sizing: border-box;
            flex: 1 1 0;
            height: auto;
            min-height: 0;
            overflow: hidden;
        }
        .mbzPreviewRoot > * { flex: 0 0 auto; }
        .mbzPreviewRoot > .mbzTrackScroll { flex: 1 1 0; min-height: 0; overflow-y: auto; }
        .mbzFieldScroll { flex: 0 0 auto; max-height: 14em; overflow-y: auto; }
        .mbzMetaTable { border-collapse: collapse; font-size: 0.95em; }
        .mbzMetaTable th {
            text-align: left;
            padding: 2px 12px 2px 0;
            font-weight: normal;
            opacity: 0.7;
            white-space: nowrap;
            vertical-align: top;
        }
        .mbzMetaTable td { padding: 2px 24px 2px 0; user-select: text; }
        .mbzMetaTable td:last-child { padding-right: 0; }
        .mbzTable { width: 100%; border-collapse: collapse; font-size: 0.95em; }
        .mbzTable th {
            text-align: left;
            padding: 4px 8px;
            font-weight: bold;
            white-space: nowrap;
            background: var(--backgroundColor, rgba(128, 128, 128, 0.15));
            border-bottom: 1px solid rgba(128, 128, 128, 0.4);
        }
        .mbzTable td {
            padding: 3px 8px;
            vertical-align: top;
            border-top: 1px solid rgba(128, 128, 128, 0.2);
        }
        .mbzTable td.mbzGuid { font-family: monospace; white-space: nowrap; user-select: text; }
        .mbzTable td.mbzNowrap { white-space: nowrap; }
        .mbzNote { opacity: 0.7; }
        .mbzWarning { color: #d9534f; white-space: normal; }
        .mbzHidden { display: none !important; }
        .mbzDisabled { opacity: 0.5; pointer-events: none; }
        .mbzButton { padding: 0 14px; line-height: 24px; }
    </style>
</head>

<body data-posSaveName="dlgMBzPreview" data-defaultSize="1200,960">
    <div class="flex column fill padding mbzPreviewRoot" style="gap: 10px;">

        <label data-id="summary" class="padding" data-localize>Reading the release from MusicBrainz...</label>
        <label data-id="warning" class="mbzWarning" style="display: none;" data-localize></label>

        <div data-id="metaScroll" class="mbzHidden">
            <table data-id="meta" class="mbzMetaTable">
                <tbody data-id="metaRows"></tbody>
            </table>
        </div>

        <div data-id="fields" class="mbzFieldScroll mbzHidden">
            <table class="mbzTable">
                <thead>
                    <tr>
                        <th></th>
                        <th data-localize>Field</th>
                        <th data-localize>Current</th>
                        <th data-localize>MusicBrainz</th>
                        <th data-localize>Changes</th>
                    </tr>
                </thead>
                <tbody data-id="fieldRows"></tbody>
            </table>
        </div>

        <div class="flex row" style="align-items: center; gap: 8px;">
            <div class="button mbzButton mbzHidden" data-id="btnApply" data-localize>Apply selected</div>
            <label data-id="applyStatus" class="fill"></label>
        </div>

        <div data-id="tracks" class="scrollable fill mbzTrackScroll mbzHidden">
            <table class="mbzTable">
                <thead>
                    <tr>
                        <th data-localize>Disc</th>
                        <th data-localize>Track</th>
                        <th data-localize>Title</th>
                        <th data-localize>Length</th>
                        <th data-localize>ISRC</th>
                        <th data-localize>Recording ID</th>
                    </tr>
                </thead>
                <tbody data-id="trackRows"></tbody>
            </table>
        </div>

        <label data-id="note" class="mbzNote" data-localize>Nothing is written until Apply.</label>
    </div>
</body>

</html>
